name: Ladeauslastung abfragen

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten (UTC); GitHub startet geplante Läufe oft einige Minuten später
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abfrage
        run: python3 crawl.py
      - name: Ergebnis speichern
        run: |
          git config user.name "ladeauslastung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live agg events state
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -q -m "Abfrage $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
