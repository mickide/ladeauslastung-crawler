name: Ladeauslastung abfragen

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # alle 15 Minuten (UTC); GitHub startet geplante Läufe oft einige Minuten später
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Daten-Branch holen
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir data && git -C data init -q -b data
            git -C data remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abfrage
        run: python3 crawl.py
      - name: Ergebnis speichern (ohne Historie)
        working-directory: data
        run: |
          git config user.name "ladeauslastung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            git commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git push -q --force origin data
